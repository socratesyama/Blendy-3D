<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blendy 3D</title>
<style>
:root{--bg:#161a24;--p:#1d2230;--p2:#283044;--ln:#363f56;--tx:#e9edf6;--mu:#8e99b3;--ac:#3ddbbd;--on:#07201b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:grid;grid-template:44px 1fr 24px/52px 1fr 288px;font:13px/1.45 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
header{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--p);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.logo svg{width:26px;height:26px;color:var(--ac)}
#sb{flex:1;max-width:540px;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--mu);text-align:left}
#sb:hover{border-color:var(--ac)}
#sb kbd{margin-left:auto}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--ln);border-radius:4px;padding:0 5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--ac);color:var(--on);font-weight:700;text-decoration:none}
nav{background:var(--p);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;overflow:auto}
nav button{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--mu);flex:none}
nav button:hover{background:var(--p2);color:var(--tx)}
nav button.on{background:var(--ac);color:var(--on)}
nav hr{width:28px;border:0;border-top:1px solid var(--ln);margin:4px 0}
#vp{position:relative;min-width:0;min-height:0}
#vp canvas{display:block;width:100%;height:100%;touch-action:none}
aside{background:var(--p);border-left:1px solid var(--ln);overflow:auto;padding:10px}
aside h3{margin:14px 0 6px;font-size:12px;color:var(--mu);font-weight:600}
aside h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--p2)}
.row.on{background:#17403c;outline:1px solid var(--ac)}
.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{color:var(--mu)}
.g3{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:4px;align-items:center;margin-bottom:4px}
.g3 label{color:var(--mu)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:4px 6px;min-width:0;width:100%}
input[type=color]{padding:0;height:28px}
input[type=range]{padding:0;accent-color:var(--ac);grid-column:2/5}
footer{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--p);border-top:1px solid var(--ln);color:var(--mu);font-size:12px}
footer span:last-child{margin-left:auto}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ln);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center}
#toast.on{opacity:1}
#hint{position:absolute;left:12px;top:12px;max-width:300px;background:rgba(29,34,48,.94);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;color:var(--mu)}
#hint b{color:var(--tx)}
#hint p{margin:6px 0}
#hint button{margin-top:4px;color:var(--ac);padding:0}
.modal{position:fixed;inset:0;background:rgba(5,8,14,.6);display:none;justify-content:center;align-items:flex-start;padding-top:9vh;z-index:9}
.modal.on{display:flex}
.box{width:min(640px,94vw);background:var(--p);border:1px solid var(--ln);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
#q{border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:14px 16px;font-size:16px}
#cats{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--ln)}
#cats button{padding:3px 10px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
#cats button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
#res{max-height:50vh;overflow:auto}
#res .it{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer}
#res .it.on{background:var(--p2)}
#res small{margin-left:auto;color:var(--mu)}
#pimg{max-width:100%;max-height:60vh;display:block;margin:auto;background:repeating-conic-gradient(#555 0 25%,#444 0 50%) 0 0/16px 16px}
@media(max-width:760px){body{grid-template:44px 1fr 40vh 24px/52px 1fr}header,footer{grid-column:1/3}aside{grid-column:1/3;border-left:0;border-top:1px solid var(--ln)}#sb span{display:none}#hint{display:none}}
#pad{position:absolute;left:12px;bottom:12px;background:rgba(29,34,48,.94);border:1px solid var(--ln);border-radius:10px;padding:8px;display:none;min-width:158px}
#pad .ph{display:flex;align-items:center;gap:6px;margin-bottom:4px}
#pad select{width:auto;padding:2px 4px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;font:inherit}
#pad .pr{display:flex;align-items:center;gap:6px;margin-top:4px}
#pad label{flex:1;color:var(--mu)}
#pad button{width:36px;height:30px;border:1px solid var(--ln);border-radius:6px;display:grid;place-items:center}
#pad button:hover{background:var(--p2);border-color:var(--ac)}
.btn.alt{background:var(--p2);color:var(--tx)}
#tut{position:absolute;right:12px;top:12px;width:min(320px,92%);background:rgba(29,34,48,.96);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;display:none;max-height:calc(100% - 24px);overflow:auto}
#tut h4{margin:6px 0 4px;font-size:15px}
#tut p{margin:4px 0;color:var(--mu)}
#tut .tl{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
#tut .tl span{border:1px solid var(--ln);border-radius:99px;padding:1px 8px;font-size:12px}
#tut .tb{display:flex;gap:6px;margin-top:6px}
#tut .tb .btn{flex:1;justify-content:center}
#tut .btn[disabled]{opacity:.5;cursor:default}
@media(max-width:760px){#pad{bottom:auto;top:12px}}
</style>
</head>
<body>
<header>
  <div class="logo" id="lg"></div>
  <button id="sb" aria-label="コマンドを検索"></button>
  <button class="btn" id="ex"></button>
  <button class="btn alt" id="tu">ウサギを作る</button>
  <button class="btn alt" id="bl">Blender連携</button>
  <button class="btn alt" id="pr">3Dプリント</button>
</header>
<nav id="nv"></nav>
<main id="vp">
  <div id="hint"><b>はじめに</b>
    <p>上の検索ボックス (Ctrl+K) に「球」「赤」「回転」「複製」などを入力して選ぶだけで操作できます。</p>
    <p>物体を選ぶと矢印や輪のハンドルが出ます。ドラッグで移動・回転・拡大縮小 (上下の移動は緑の矢印)。左下のボタンでも動かせます。空白のドラッグで視点回転、右ドラッグで平行移動、ホイールで拡大縮小。</p>
    <p>できあがったら右上の「PNG書き出し」へ。</p>
    <button id="hx">閉じる</button></div>
  <div id="toast"></div>
</main>
<aside id="side"></aside>
<footer><span id="st"></span><span id="cc"></span></footer>

<div class="modal" id="pal"><div class="box">
  <input id="q" placeholder="やりたいことを入力 (例: 赤 / 回転 / 球 / 複製)" autocomplete="off" aria-label="コマンド検索">
  <div id="cats"></div><div id="res"></div>
</div></div>

<div class="modal" id="pv"><div class="box" style="padding:16px">
  <img id="pimg" alt="書き出しプレビュー">
  <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
    <span id="pz" style="margin-right:auto;color:var(--mu)"></span>
    <button id="pc" class="btn" style="background:var(--p2);color:var(--tx)">閉じる</button>
    <a id="pd" class="btn" download="blendy3d.png">PNGを保存</a>
  </div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),PI=Math.PI,S2=PI*2,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 手描きアイコン (24x24 ストローク) */
const IC={
sel:'M5 3l13 8-6 1.5L9.5 19z',
move:'M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3',
rot:'M19 12a7 7 0 1 1-2.1-5M19 4v4h-4',
scl:'M4 20V10h10v10zM14 10l6-6M15 4h5v5',
cube:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',
sphere:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12c0 2 4 3.5 9 3.5s9-1.5 9-3.5',
light:'M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3zM9.5 20h5',
search:'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM15.5 15.5L20 20',
undo:'M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 8h-2',
redo:'M15 7l5 5-5 5M20 12H10a6 6 0 0 0 0 8h2',
trash:'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',
copy:'M8 8h11v11H8zM5 16V5h11',
cam:'M4 8h11v9H4zM15 11l5-3v9l-5-3',
img:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15 9.5h.01',
grid:'M4 4h16v16H4zM4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16',
eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
eyeoff:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM3 3l18 18',
wave:'M3 12c3-6 5-6 9 0s6 6 9 0'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const CI={追加:'cube',移動:'move',回転:'rot',拡大縮小:'scl',色:'sphere',素材:'sphere',変形:'wave',配置:'grid',編集:'copy',ライト:'light',シーン:'grid',カメラ:'cam',書き出し:'img',テンプレート:'cube'};
$('#lg').innerHTML=ic('cube')+'Blendy 3D';
$('#ex').innerHTML=ic('img')+'PNG書き出し';
/* ---------- 3D 基盤 ---------- */
const vp=$('#vp'),R=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true}),cv=R.domElement;
R.shadowMap.enabled=true;vp.prepend(cv);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(50,1,.1,500);
let bg='#2b3144';scene.background=new T.Color(bg);
const amb=new T.HemisphereLight(0xffffff,0x39404f,.75);
const sun=new T.DirectionalLight(0xffffff,.9);sun.position.set(6,9,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:40});
const grid=new T.GridHelper(24,24,0x5d6882,0x3c4459),axes=new T.AxesHelper(2.5);
const floor=new T.Mesh(new T.PlaneGeometry(60,60).rotateX(-PI/2),new T.ShadowMaterial({opacity:.3}));floor.receiveShadow=true;floor.position.y=-.001;
scene.add(amb,sun,grid,axes,floor);
const cs={t:new T.Vector3(0,.8,0),th:.8,ph:1.1,r:9};
function placeCam(){cam.position.set(cs.t.x+cs.r*Math.sin(cs.ph)*Math.sin(cs.th),cs.t.y+cs.r*Math.cos(cs.ph),cs.t.z+cs.r*Math.sin(cs.ph)*Math.cos(cs.th));cam.lookAt(cs.t)}
new ResizeObserver(()=>{const w=vp.clientWidth,h=vp.clientHeight;R.setPixelRatio(devicePixelRatio);R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}).observe(vp);
/* ---------- 状態 ---------- */
let objs=[],sel=[],tool='move',hist=[],fut=[],turn=0,cnt=0,BH=[],pend=null;
const Y=new T.Vector3(0,1,0),V=(a,v)=>{const r=new T.Vector3();r[a]=v;return r};
const bs=o=>new T.Box3().setFromObject(o).getSize(new T.Vector3());
const need=()=>{if(!sel.length)throw Error('先にオブジェクトを選んでください');return sel};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)};
const dirty=()=>scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});

const S3=[.2,.1,0];
const G={
box:['立方体',()=>new T.BoxGeometry(1.4,1.4,1.4,12,12,12),'cube box 箱 四角'],
slab:['板',()=>new T.BoxGeometry(2.4,.2,1.6,12,1,8),'slab plate'],
wall:['壁',()=>new T.BoxGeometry(3,2,.2,12,8,1),'wall'],
pillar:['柱',()=>new T.BoxGeometry(.5,3,.5,2,12,2),'pillar column'],
sph:['球',()=>new T.SphereGeometry(.6,48,32),'sphere ball 丸'],
lowsph:['低ポリ球',()=>new T.SphereGeometry(.7,10,7),'lowpoly sphere'],
egg:['卵',()=>new T.SphereGeometry(.6,48,32).scale(1,1.3,1),'egg'],
half:['半球',()=>new T.SphereGeometry(.8,40,20,0,S2,0,PI/2),'hemisphere dome ドーム'],
cyl:['円柱',()=>new T.CylinderGeometry(.6,.6,1.4,48,8),'cylinder'],
disc:['円盤',()=>new T.CylinderGeometry(1,1,.15,64,1),'disc plate'],
pipe:['筒',()=>new T.CylinderGeometry(.6,.6,1.4,48,8,true),'pipe tube'],
cone:['円錐',()=>new T.ConeGeometry(.7,1.4,48,8),'cone'],
pyr:['四角錐',()=>new T.ConeGeometry(.9,1.3,4,6),'pyramid'],
hex:['六角柱',()=>new T.CylinderGeometry(.7,.7,1,6,4),'hexagon'],
prism:['三角柱',()=>new T.CylinderGeometry(.8,.8,1.4,3,4),'prism triangle'],
tor:['ドーナツ',()=>new T.TorusGeometry(.6,.25,24,64).rotateX(PI/2),'torus donut'],
ring:['細いリング',()=>new T.TorusGeometry(.8,.06,16,64).rotateX(PI/2),'ring'],
knot:['結び目',()=>new T.TorusKnotGeometry(.5,.16,128,16),'torus knot'],
pla:['平面',()=>new T.PlaneGeometry(3,3,16,16).rotateX(-PI/2),'plane floor 床'],
circ:['円',()=>new T.CircleGeometry(1,48).rotateX(-PI/2),'circle'],
ico:['二十面体',()=>new T.IcosahedronGeometry(.7,0),'icosahedron'],
oct:['八面体',()=>new T.OctahedronGeometry(.7,0),'octahedron'],
tet:['四面体',()=>new T.TetrahedronGeometry(.8,0),'tetrahedron'],
dod:['十二面体',()=>new T.DodecahedronGeometry(.7,0),'dodecahedron'],
vase:['花瓶',()=>new T.LatheGeometry([...Array(24)].map((_,i)=>new T.Vector2(.3+.25*Math.sin(i*.28),i*.07-.8)),48),'vase lathe'],
cap:['カプセル',()=>{const p=[];for(let i=0;i<=8;i++){const a=i/8*PI/2;p.push(new T.Vector2(Math.sin(a)*.4,-.4-Math.cos(a)*.4))}for(let i=0;i<=8;i++){const a=i/8*PI/2;p.push(new T.Vector2(Math.cos(a)*.4,.4+Math.sin(a)*.4))}return new T.LatheGeometry(p,32)},'capsule pill']
};
function mk(g,name,col){const m=new T.Mesh(g,new T.MeshStandardMaterial({color:col||'#c8ced8',roughness:.55,metalness:.05,side:T.DoubleSide}));m.name=name+' '+(++cnt);m.castShadow=m.receiveShadow=true;return m}
const reg=m=>{objs.push(m);scene.add(m);return m};
function addShape(k){const g=G[k][1]();g.computeBoundingBox();const m=mk(g,G[k][0]),n=objs.length,p=[[0,0],[2,0],[-2,0],[0,2],[0,-2],[2,2],[-2,2],[2,-2],[-2,-2]][n%9],o=Math.floor(n/9)*.5;m.position.set(p[0]+o,-g.boundingBox.min.y,p[1]+o);m.userData.kind=k;reg(m);sel=[m]}
function put(k,pos,size,col,ry){const g=G[k][1]();g.computeBoundingBox();const b=g.boundingBox.getSize(new T.Vector3()),m=mk(g,G[k][0],col);m.scale.set(size[0]/b.x,size[1]/b.y,size[2]/b.z);m.position.set(...pos);if(ry)m.rotation.y=ry;m.userData.kind=k;return reg(m)}
function addLight(kind,col){const m=new T.Mesh(new T.SphereGeometry(.2,16,12),new T.MeshStandardMaterial({color:col,emissive:col,roughness:1}));m.name='ライト '+(++cnt);
 const L=kind=='p'?new T.PointLight(col,1.3,40,1):kind=='s'?new T.SpotLight(col,1.6,60,.6,.4,1):new T.DirectionalLight(col,.8);L.castShadow=kind!='p';m.add(L);m.userData.light=L;m.position.set(0,4,0);reg(m);sel=[m]}
function dup(o,d){const c=o.clone();c.material=o.material.clone();if(o.userData.light)c.userData={light:c.children.find(x=>x.isLight)};c.name=o.name.replace(/ \d+$/,'')+' '+(++cnt);if(d)c.position.add(d);return reg(c)}
function del(){need().forEach(o=>scene.remove(o));objs=objs.filter(o=>!sel.includes(o));sel=[]}
/* ---------- 履歴 ---------- */
const mp=m=>({c:m.color.getHex(),r:m.roughness,m:m.metalness,e:m.emissive.getHex(),ei:m.emissiveIntensity,w:m.wireframe,o:m.opacity,f:m.flatShading,t:m.map,vc:m.vertexColors});
const snap=()=>({list:objs.slice(),sel:sel.slice(),st:objs.map(o=>({o,p:o.position.clone(),r:o.rotation.clone(),s:o.scale.clone(),v:o.visible,g:o.geometry,n:o.name,m:mp(o.material)}))});
function restore(s){objs.forEach(o=>scene.remove(o));objs=s.list.slice();objs.forEach(o=>scene.add(o));
 s.st.forEach(x=>{const o=x.o,m=o.material,q=x.m;o.position.copy(x.p);o.rotation.copy(x.r);o.scale.copy(x.s);o.visible=x.v;o.geometry=x.g;o.name=x.n;m.color.setHex(q.c);m.roughness=q.r;m.metalness=q.m;m.emissive.setHex(q.e);m.emissiveIntensity=q.ei;m.wireframe=q.w;m.opacity=q.o;m.transparent=q.o<1;m.flatShading=q.f;m.map=q.t;m.vertexColors=q.vc;m.needsUpdate=true;if(o.userData.light)o.userData.light.color.setHex(q.c)});
 sel=s.sel.slice();dirty()}
function undo(){if(!hist.length)return toast('これ以上戻せません');fut.push(snap());restore(hist.pop());refresh()}
function redo(){if(!fut.length)return toast('やり直す操作がありません');hist.push(snap());restore(fut.pop());refresh()}
function run(c){if(!c)return;let b=c.nh?null:snap();try{c.f()}catch(e){toast(e.message);return}if(b){hist.push(b);if(hist.length>80)hist.shift();fut=[];dirty()}refresh()}
/* ---------- コマンド定義 ---------- */
const CMD=[],C=(c,n,k,f,nh)=>CMD.push({c,n,k:(c+' '+n+' '+k).toLowerCase(),f,nh});
const AX=[['x','X','左右'],['y','Y','上下'],['z','Z','前後']],DW={x:['左','右'],y:['下','上'],z:['奥','手前']},sg=v=>v>0?'+'+v:''+v;
const eM=f=>need().forEach(o=>f(o.material,o));
function setCol(h,list){list.forEach(o=>{o.material.color.set(h);if(o.material.vertexColors){o.material.vertexColors=false;o.material.needsUpdate=true}if(o.userData.light){o.userData.light.color.set(h);o.material.emissive.set(h)}})}
const col=h=>setCol(h,need());

/* 追加 */
Object.entries(G).forEach(([k,v])=>C('追加',v[0]+'を追加','add create new '+v[2],()=>addShape(k)));
/* 移動 */
AX.forEach(([a,A,w])=>[-1,1].forEach(s=>[.1,.5,1,5].forEach(d=>C('移動',`${DW[a][s>0?1:0]}へ ${d} 移動`,`move translate ${A} ${w} ${a}`,()=>need().forEach(o=>o.position[a]+=s*d)))));
/* 回転 */

side.onclick=e=>{const v=e.target.closest('[data-v]');if(v){const o=objs[+v.dataset.v];o.visible=!o.visible;refresh();return}const r=e.target.closest('[data-i]');if(r){const o=objs[+r.dataset.i];sel=e.shiftKey?(sel.includes(o)?sel.filter(s=>s!==o):[...sel,o]):[o];refresh()}};
side.addEventListener('focusin',e=>{if(e.target.dataset.k)pend=snap()});
side.addEventListener('pointerdown',e=>{if(e.target.dataset.k)pend=snap()});
side.addEventListener('input',e=>{const k=e.target.dataset.k,a=sel[sel.length-1];if(!k||!a)return;const v=e.target.value,n=parseFloat(v);
 if(k=='name')a.name=v;else if(k=='col')setCol(v,[a]);else if(k=='rough')a.material.roughness=n;else if(k=='metal')a.material.metalness=n;
 else if(!isNaN(n)){const t={p:a.position,r:a.rotation,s:a.scale}[k[0]];t[k[1]]=k[0]=='r'?n*PI/180:n}});
side.addEventListener('change',()=>{if(pend){hist.push(pend);fut=[];pend=null}});
function refresh(){sel=sel.filter(o=>objs.includes(o));syncSel();panel();padDraw();$('#st').textContent=`物体 ${objs.length} / 選択 ${sel.length} / ドラッグ操作: ${{move:'移動',rot:'回転',scl:'拡大縮小'}[tool]}`;$('#cc').textContent=CMD.length+' 個の操作が使えます'}

/* ---------- 左ツールバー ---------- */
const NV=[['move','sel','選択・移動 (G)'],['rot','rot','回転 (R)'],['scl','scl','拡大縮小 (S)'],0,
['p:追加','cube','図形を追加'],['p:ライト','light','ライトを追加'],['p:切断','cut','切断・断面'],['p:ブーリアン','join','合体・くり抜き'],['c:複製','copy','複製 (Ctrl+D)'],['c:削除','trash','削除 (Delete)'],0,['u','undo','元に戻す (Ctrl+Z)'],['r','redo','やり直す (Ctrl+Shift+Z)']];
$('#nv').innerHTML=NV.map(x=>x?`<button data-t="${x[0]}" aria-label="${x[2]}" title="${x[2]}">${ic(x[1])}</button>`:'<hr>').join('');
function setTool(t){tool=t;document.querySelectorAll('#nv [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));refresh()}
$('#nv').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=b.dataset.t;if(t=='move'||t=='rot'||t=='scl')setTool(t);else if(t=='u')undo();else if(t=='r')redo();else if(t[0]=='p')openPal(t.slice(2));else run(CMD.find(c=>c.n==t.slice(2)))};
$('#ex').onclick=()=>shot(2,0);

/* ---------- パレット ---------- */
const pal=$('#pal'),q=$('#q'),res=$('#res'),cats=$('#cats'),CATS=[...new Set(CMD.map(c=>c.c))];
let pc='すべて',pi=0,pl=[];
function openPal(c){pc=c||'すべて';q.value='';pi=0;pal.classList.add('on');drawPal();q.focus()}
function drawPal(){const t=q.value.toLowerCase().split(/\s+/).filter(Boolean);pl=CMD.filter(c=>(pc=='すべて'||c.c==pc)&&t.every(w=>c.k.includes(w)));pi=Math.min(pi,Math.max(pl.length-1,0));
 cats.innerHTML=['すべて',...CATS].map(c=>`<button class="${c==pc?'on':''}" data-c="${c}">${c}</button>`).join('');
 res.innerHTML=pl.slice(0,120).map((c,i)=>`<div class="it${i==pi?' on':''}" data-i="${i}">${ic(CI[c.c]||'cube')}<span>${c.n}</span><small>${c.c}</small></div>`).join('')||'<div class="it" style="color:var(--mu)">見つかりません。別の言葉で試してください (例: 赤 / 回転 / 複製 / 球)</div>';
 const a=res.querySelector('.on');if(a)a.scrollIntoView({block:'nearest'})}
const closeAll=()=>{pal.classList.remove('on');$('#pv').classList.remove('on')};
const execPal=i=>{const c=pl[i];closeAll();run(c)};
q.oninput=()=>{pi=0;drawPal()};
cats.onclick=e=>{const c=e.target.dataset.c;if(c){pc=c;pi=0;drawPal();q.focus()}};
res.onclick=e=>{const i=e.target.closest('.it');if(i&&i.dataset.i!=null)execPal(+i.dataset.i)};
[pal,$('#pv')].forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target==m)closeAll()}));
$('#pc').onclick=closeAll;$('#sb').onclick=()=>openPal();$('#hx').onclick=()=>$('#hint').remove();
$('#sb').innerHTML=ic('search')+'<span>やりたいことを検索して実行</span><kbd>Ctrl+K</kbd>';
/* ---------- キーボード ---------- */
addEventListener('keydown',e=>{const typing=['INPUT','SELECT'].includes(e.target.tagName),k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
 if(c&&k=='k'||(!typing&&e.key=='/')){e.preventDefault();openPal();return}
 if(k=='escape'){closeAll();return}
 if(pal.classList.contains('on')){if(k=='arrowdown'||k=='arrowup'){e.preventDefault();pi=clamp(pi+(k=='arrowdown'?1:-1),0,Math.max(pl.length-1,0));drawPal()}else if(k=='enter'){e.preventDefault();execPal(pi)}return}
 if(typing)return;
 const by=n=>run(CMD.find(x=>x.n==n)),ar={arrowleft:['x',-1],arrowright:['x',1],arrowup:['z',-1],arrowdown:['z',1],pageup:['y',1],pagedown:['y',-1]}[k];
 if(c&&k=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(c&&k=='y'){e.preventDefault();redo()}else if(c&&k=='d'){e.preventDefault();by('複製')}
 else if(k=='delete'||k=='backspace')by('削除');else if(k=='g')setTool('move');else if(k=='r'&&!c)setTool('rot');else if(k=='s'&&!c)setTool('scl');
 else if(k=='f')by('選んだ物体を画面に収める');else if(k=='a'&&!c)by('すべて選択');
 else if(ar){e.preventDefault();run({f:()=>need().forEach(o=>o.position[ar[0]]+=ar[1]*.5)})}});

/* ---------- ビューポート操作 ---------- */
const ray=new T.Raycaster(),mv=new T.Vector2(),gp=new T.Plane(Y,0);let dr=null;
function ndc(e){const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(mv,cam)}
const pickAt=e=>{ndc(e);const h=ray.intersectObjects(objs.filter(o=>o.visible),false)[0];return h&&h.object},hitPlane=e=>{ndc(e);const p=new T.Vector3();return ray.ray.intersectPlane(gp,p)?p:null};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);let o=e.button==0?pickAt(e):null;dr={x:e.clientX,y:e.clientY,o,b:e.button,sh:e.shiftKey,moved:false};
 if(o){if(e.shiftKey&&sel.includes(o)){sel=sel.filter(s=>s!==o);refresh();dr.o=null;return}
  if(!sel.includes(o)){sel=e.shiftKey?[...sel,o]:[o];refresh()}
  dr.pre=snap();gp.constant=-o.position.y;dr.p0=hitPlane(e);dr.st=sel.map(s=>s.position.clone())}});
cv.addEventListener('pointermove',e=>{if(!dr)return;if(!dr.moved&&Math.hypot(e.clientX-dr.x,e.clientY-dr.y)<3)return;dr.moved=true;const mx=e.movementX||0,my=e.movementY||0;
 if(dr.o){if(tool=='move'){const p=hitPlane(e);if(p&&dr.p0)sel.forEach((s,i)=>{s.position.x=dr.st[i].x+p.x-dr.p0.x;s.position.z=dr.st[i].z+p.z-dr.p0.z})}
  else if(tool=='rot')sel.forEach(s=>{s.rotation.y+=mx*.01;s.rotation.x+=my*.01});
  else{const f=1-my*.01;sel.forEach(s=>s.scale.multiplyScalar(f))}}
 else if(dr.b==0&&!e.shiftKey){cs.th-=mx*.008;cs.ph=clamp(cs.ph-my*.008,.05,PI-.05)}
 else{const r=new T.Vector3().setFromMatrixColumn(cam.matrix,0),u=new T.Vector3().setFromMatrixColumn(cam.matrix,1),k=cs.r*.0015;cs.t.addScaledVector(r,-mx*k).addScaledVector(u,my*k)}});
cv.addEventListener('pointerup',()=>{if(!dr)return;if(dr.o&&dr.moved){hist.push(dr.pre);fut=[];refresh()}else if(!dr.moved&&dr.b==0&&!dr.o&&!dr.sh){sel=[];refresh()}dr=null});
cv.addEventListener('wheel',e=>{e.preventDefault();cs.r=clamp(cs.r*Math.exp(e.deltaY*.001),1,80)},{passive:false});

/* ---------- 起動 ---------- */
addShape('sph');col('#3a7bd5');addShape('box');col('#ff9f1c');addShape('tor');col('#ff4d9d');sel=[];
setTool('move');
let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.1);last=t;if(turn)cs.th+=turn*dt;placeCam();BH.forEach(h=>h.update());gzUpdate();R.render(scene,cam)})(last);
</script>
</body>
</html>
